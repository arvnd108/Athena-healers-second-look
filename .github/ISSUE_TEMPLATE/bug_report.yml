name: Bug Report
description: Report something in the existing implementation that isn't working as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check `README.md` §8 (Troubleshooting) and `ISSUES.md`
        (every currently known problem) — your issue may already be documented
        there as a known limitation rather than a new bug.

        **Never include real patient data, PHI, or PII anywhere in this form.**
        See `POLICY.md` §5. Use synthetic or de-identified examples only.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands run, using synthetic/de-identified data only.
      placeholder: |
        1. `pip install -e ".[dev]"`
        2. Run `...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      render: shell

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "python --version"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I confirmed this isn't already documented as a known issue in `ISSUES.md`.
          required: true
        - label: I confirmed `pytest` (offline, 549 tests) passes on a clean checkout, or I've noted here that it doesn't.
          required: true
        - label: This report contains no real patient data, PHI, or PII.
          required: true
