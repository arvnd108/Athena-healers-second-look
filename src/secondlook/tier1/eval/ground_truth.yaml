# Ground-truth eval set for Tier 1 retrieval Modes 1-3.
#
# Every pair is sourced from data that is actually loaded in the live
# graph (Phases 2/3/5) -- confirmed live via direct Cypher queries before
# writing this file, never hand-written/fictional data points. The one
# deliberate exception is the `gene` field on mode2_path_b pairs: those
# name REAL, clinically documented genes/fusions that are correctly
# ABSENT from this repo's narrow 17-disease CIViC scope -- that absence is
# the entire point of the test (Mode 1/path (a) must find nothing for
# them; only disease+drug_class relaxation should).
#
# config_version exists so a re-load of the graph with different scope
# can invalidate this file's assumptions explicitly rather than silently.
#
# Total: 22 pairs. NOT ~50 -- the master spec's "~50-pair" target assumes
# a broader load than this repo's current 46-evidence-item / 5-publication
# scope actually supports without inventing data. Every bucket below uses
# its full honest real-data ceiling (e.g. exactly the 4 variants with
# hgvs_p exist; exactly 5 genes have more than one loaded variant) rather
# than being padded with duplicates or fabricated cases to hit a round
# number. Flagged explicitly, not silently under-delivered.
#
# Schema per pair:
#   id                       short stable identifier
#   bucket                   mode1_exact | mode1_exact_negative |
#                            mode2_path_a | mode2_path_b | mode3_semantic
#   gene                     Gene.symbol as loaded (or, for mode2_path_b,
#                            a real gene/fusion NOT in this graph)
#   key_type                 "hgvs_p" | "variant_name" | null (mode3 only)
#   key_value                the hgvs_p or variant_name string to query
#   disease                  Disease.name, only used by mode2_path_b
#   drug_class               Drug.drug_class, only used by mode2_path_b
#   query_text               free-text query, mode3_semantic only
#   expected_mode            "exact" | "relaxed" | "semantic" | "none"
#                            ("none" = a negative case, expect zero items)
#   expected_relaxation_type "same_gene_different_variant" |
#                            "same_disease_drug_class" | null
#   expected_citation_id     civic_id (mode1/mode2) or pmid (mode3) as a
#                            string, or null for a negative case
#   notes                    why this pair was chosen

