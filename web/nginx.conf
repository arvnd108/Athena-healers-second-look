# Serves the Subsystem M static bundle. Two things matter here, both
# direct consequences of the low-bandwidth design in vite.config.js and
# docs/performance-budget.md:
#
# 1. gzip on -- the bundle is already small; compress it further for the
#    slow links this project targets.
# 2. SPA fallback (`try_files ... /index.html`) -- React Router runs in
#    BrowserRouter mode, so a hard refresh on any client-side route (e.g.
#    /cases/abc123) must resolve to index.html, not a 404, and let the
#    client-side router take over from there.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bundle filenames are content-hashed by Vite -- safe to cache
    # aggressively. index.html is not hashed, so it's excluded (default
    # nginx caching applies) to make sure a redeploy is picked up.
    location ~* \.(?:js|css|svg|png|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
